name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Code style and static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Code style
        run: composer lint:php

      - name: Static analysis
        run: composer analyse

  # assets/admin.css ships compiled, so that installing the library needs no
  # build: it must match what assets/scss gives.
  stylesheet:
    name: Stylesheet built from the SCSS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Compare
        run: git diff --exit-code assets/admin.css

  # The oldest PHP the library supports: PHPStan reads the code for it, this
  # job has the parser of that version run it.
  syntax:
    name: PHP 8.2 syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint
        run: find bootstrap.php version.php src -name '*.php' -print0 | xargs -0 -n1 php -l

  # The tests run in a WordPress the suite installs, on SQLite. Pest 4 needs
  # PHP 8.3, so 8.2 is left to PHPStan and to the syntax job.
  test:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Tests
        run: composer test
